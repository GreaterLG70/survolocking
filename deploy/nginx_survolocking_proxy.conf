    # Survolocking 反代：外部 https://survoid.top/sl/*  ->  容器 127.0.0.1:8000/*
    # 该文件放在 aaPanel 管理的 proxy 包含目录，不会被站点配置重建覆盖：
    #   /www/server/panel/vhost/nginx/proxy/8.153.36.132/survolocking.conf
    # 应用自身路由前缀为 /api，故外部 /sl/api/... 经本规则映射到 127.0.0.1:8000/api/...
    location = /sl { return 301 /sl/; }
    location /sl/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
