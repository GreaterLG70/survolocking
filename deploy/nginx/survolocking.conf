# Survolocking 反向代理
# 放置路径：/etc/nginx/conf.d/default.conf
#
# 前置条件：证书放到 deploy/certs/ 下（fullchain.pem / privkey.pem）

# HTTP → HTTPS
server {
    listen 80;
    server_name survoid.top;

    # Let's Encrypt 校验路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

upstream survolocking_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name survoid.top;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 2m;

    # 反向代理（应用挂在 /sl/ 前缀下，映射 /sl/* -> /*）
    location /sl/ {
        proxy_pass         http://survolocking_api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";

        # 端侧对延迟敏感，超时设置偏紧
        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    30s;
    }

    # 健康检查不记日志，避免刷屏
    location /sl/health {
        proxy_pass http://survolocking_api;
        access_log off;
    }

    access_log /var/log/nginx/survolocking_access.log;
    error_log  /var/log/nginx/survolocking_error.log;
}
