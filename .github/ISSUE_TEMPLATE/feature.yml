name: Issue · 功能请求
description: 提出一个新功能的想法
labels: ["type: feature"]
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        把你想要的体验讲清楚。

  - type: textarea
    id: problem
    validations:
      required: true
    attributes:
      label: 这是为了解决什么问题
      description: 用一两句话讲清场景与痛点

  - type: textarea
    id: expectation
    validations:
      required: true
    attributes:
      label: 期望的体验
      description: 描述最理想的产品形态

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的备选方案
      description: 写下来帮助我们了解权衡

  - type: textarea
    id: additional
    attributes:
      label: 补充信息 / 截图
