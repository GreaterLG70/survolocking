name: Server · Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

env:
  APP_ENV: dev
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "1"               # 不可达 → 静默降级到 SQLite
  SMS_PROVIDER: dev
  no_proxy: 127.0.0.1,localhost

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Run 38-case smoke test
        working-directory: server
        run: python scripts/smoke_test.py

      - name: Run session-kick test (12 cases)
        working-directory: server
        run: python scripts/test_session_kick.py

      - name: Run hash contract test
        working-directory: server
        run: python scripts/test_hash_contract.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        working-directory: server
        run: |
          ruff check app scripts
          ruff format --check app scripts
